name: Deploy POC to GitHub Pages

# Runs only on pushes to the POC branch, or when triggered manually.
# It never runs on "main", so it can never collide with deploy.yaml
# (production), which only triggers on pushes to main.
on:
  push:
    branches:
      - main   # change if your POC branch is named differently
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Add SPA fallback for client-side routing
        # GitHub Pages has no server-side rewrite rules, so a hard refresh on
        # any route other than "/" would 404. Serving index.html as 404.html
        # lets the React Router (basename-aware) take over and resolve the route.
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4