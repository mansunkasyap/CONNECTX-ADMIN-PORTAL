name: Deploy POC

# Manual trigger only — this will NEVER run automatically on push,
# so it can't collide with the production deploy.yaml workflow.
on:
  workflow_dispatch:

jobs:
  deploy-poc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout POC branch
        uses: actions/checkout@v4
        with:
          ref: poc-new-server   # change if you name the branch differently

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package build
        run: tar -czf deploy-poc.tar.gz -C dist .

      - name: Copy to POC server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.POC_SERVER_HOST }}
          username: ${{ secrets.POC_SERVER_USER }}
          key: ${{ secrets.POC_SSH_PRIVATE_KEY }}
          source: "deploy-poc.tar.gz"
          target: "/tmp"

      - name: Deploy on POC server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.POC_SERVER_HOST }}
          username: ${{ secrets.POC_SERVER_USER }}
          key: ${{ secrets.POC_SSH_PRIVATE_KEY }}
          script: |
            sudo mkdir -p /var/www/connectx-poc
            sudo tar -xzf /tmp/deploy-poc.tar.gz -C /var/www/connectx-poc
            rm /tmp/deploy-poc.tar.gz
            sudo nginx -t && sudo systemctl reload nginx